name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release Snipping Tools
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup MinGW & Inno Setup
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" >> $env:GITHUB_PATH

      - name: Build Portable Executable
        run: |
          mkdir -p bin obj dist
          cmd /c build.bat

      - name: Package Standalone Portable (ZIP)
        id: package_portable
        run: |
          $TAG = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "${{ github.event.inputs.version }}" }
          if (-not $TAG) { $TAG = "v1.0.0" }
          
          # Create staging folder for portable release
          $portableDir = "dist/SnippingTools-Portable"
          mkdir -p $portableDir
          Copy-Item "bin/NativeSnippingTool.exe" -Destination "$portableDir/SnippingTools.exe"
          Copy-Item "resources/app.ico" -Destination "$portableDir/"
          Copy-Item "README.md" -Destination "$portableDir/"
          
          $zipName = "SnippingTools-$TAG-Portable.zip"
          Compress-Archive -Path "$portableDir/*" -DestinationPath "dist/$zipName" -Force
          echo "PORTABLE_ZIP=dist/$zipName" >> $env:GITHUB_ENV
          echo "RELEASE_TAG=$TAG" >> $env:GITHUB_ENV

      - name: Build Installer (Inno Setup)
        id: package_installer
        run: |
          iscc installer/installer.iss
          $installerFile = Get-ChildItem -Path "dist" -Filter "SnippingTools-Setup-*.exe" | Select-Object -First 1
          echo "INSTALLER_EXE=$($installerFile.FullName)" >> $env:GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Snipping Tools ${{ env.RELEASE_TAG }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.PORTABLE_ZIP }}
            ${{ env.INSTALLER_EXE }}
            bin/NativeSnippingTool.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
